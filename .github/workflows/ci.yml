name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        java:
          - 17
          - 25
        os:
          - ubuntu-latest
          - windows-latest
        sbt:
          - 'testsJVM'
          - 'testsJS'
          - 'testsNative'
          - 'plugin'
    runs-on: ${{ matrix.os }}
    env:
      GOOGLE_APPLICATION_CREDENTIALS:
        ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON:
        ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
          cache: sbt

      - name: Install LLVM
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install llvm --version="20.1.4" --allow-downgrade --force
      - name: Add LLVM on Path
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: echo "${env:ProgramFiles}\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Assert clang installed and on path
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: clang --version
      - uses: sbt/setup-sbt@v1
      - run: sbt +${{ matrix.sbt }}/test
  jsdom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: npm install
      - run: sbt +testsJS/test
        env:
          MUNIT_JS_ENV: jsdom
          GOOGLE_APPLICATION_CREDENTIALS:
            ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON:
            ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
  discovery-guard-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Assert clang installed and on path
        run: clang --version
      - uses: sbt/setup-sbt@v1
      - run: sbt checkDiscoveryNative
  discovery-guard-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: npm install
      - run: sbt checkDiscoveryJS
  mima:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt mimaReportBinaryIssues
  check:
    name: Scalafix, Scalafmt and Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: ./bin/scalafmt --check
      - run: sbt scalafixCheckAll
      - run: sbt docs/docusaurusCreateSite
